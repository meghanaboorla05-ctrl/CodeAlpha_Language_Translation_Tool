<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 150px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .languages {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .language-box {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
        }

        .result-box {
            background: #f0fdf4;
            border: 1px solid #86efac;
            padding: 15px;
            border-radius: 10px;
            min-height: 100px;
            font-size: 17px;
            white-space: pre-wrap;
        }

        .error {
            margin-top: 20px;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .languages {
                flex-direction: column;
                gap: 0;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌐 Language Translation Tool</h1>

    <p class="subtitle">
        Translate your text from one language to another
    </p>

    <form method="POST">

        <label for="text">Enter Text</label>

        <textarea
            id="text"
            name="text"
            placeholder="Enter the text you want to translate..."
        ></textarea>

        <div class="languages">

            <div class="language-box">
                <label for="source">From Language</label>

                <select name="source" id="source">
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                </select>
            </div>

            <div class="language-box">
                <label for="target">To Language</label>

                <select name="target" id="target">
                    <option value="hi">Hindi</option>
                    <option value="te">Telugu</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                </select>
            </div>

        </div>

        <button type="submit">
            Translate
        </button>

    </form>

    {% if translated_text %}
    <div class="result">

        <label>Translated Text</label>

        <div class="result-box" id="translationResult">
    {{ translated_text }}
</div>

<button type="button" onclick="copyTranslation()" class="copy-button">
    📋 Copy Translation
</button>
    </div>
    {% endif %}

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <div class="footer">
        CodeAlpha Internship Project | Language Translation Tool
    </div>

</div>
<script>
function copyTranslation() {
    const translation = document.getElementById("translationResult").innerText;

    navigator.clipboard.writeText(translation).then(function () {
        alert("Translation copied successfully!");
    }).catch(function () {
        alert("Unable to copy the translation.");
    });
}
</script>
</body>
</html>
